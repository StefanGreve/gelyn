name: Bug report
description: Report incorrect or unexpected behavior in gelyn
labels: [ bug ]

body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before Submitting
      options:
        - label: I have searched the existing issues and this has not been reported yet.
          required: true

  - type: textarea
    id: info
    attributes:
      label: Environment
      description: Output of `gelyn --info`.
      render: text
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - dotnet tool install
        - Built from source

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Include the Markdown or front matter block that triggers the problem, if relevant.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
