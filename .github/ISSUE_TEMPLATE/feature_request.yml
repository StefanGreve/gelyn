name: Feature request
description: Suggest a new capability or an improvement to gelyn
labels: [ enhancement ]

body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before Submitting
      options:
        - label: I have searched the existing issues and this has not been requested yet.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that gelyn makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What should gelyn do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Workarounds you tried, or other tools that solve this.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of gelyn this affects.
      options:
        - Markdown rendering
        - Front matter
        - CLI and commands
        - Configuration
        - Generated output
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
