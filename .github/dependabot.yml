version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
      - dependency-name: Microsoft.Extensions.*
        update-types:
          - version-update:semver-major
    groups:
      testing:
        patterns:
          - TUnit*
          - Microsoft.Testing.*
          - Microsoft.Extensions.Diagnostics.Testing
          - Microsoft.Extensions.TimeProvider.Testing
      runtime-extensions:
        patterns:
          - Microsoft.Extensions.*
        # Both also match Microsoft.Extensions.*, so exclude them here rather than rely on the group order above.
        exclude-patterns:
          - Microsoft.Extensions.Diagnostics.Testing
          - Microsoft.Extensions.TimeProvider.Testing
      # TestingHelpers ships in lockstep with the library it fakes, so the two have to move in one pull request.
      io-abstractions:
        patterns:
          - TestableIO.System.IO.Abstractions*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "08:00"
      timezone: Europe/Berlin
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
      time: "08:00"
      timezone: Europe/Berlin
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
