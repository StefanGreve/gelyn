name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            src/Gelyn/packages.lock.json
            .config/dotnet-tools.json

      - name: Restore Dependencies
        run: dotnet restore Gelyn.slnx

      - name: Restore Local Tools
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: dotnet tool restore

      - name: Verify Formatting
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: dotnet format Gelyn.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Gelyn.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        id: test
        run: dotnet test Gelyn.slnx --configuration Release --no-build

      - name: Render Coverage Report
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' && matrix.os == 'ubuntu-latest' }}
        run: |
          dotnet tool run reportgenerator \
            -reports:TestResults/CoverageReport/coverage.cobertura.xml \
            -targetdir:TestResults/CoverageReport \
            -reporttypes:'Html;MarkdownSummaryGithub' \
            '-filefilters:-**/obj/**'
          cat TestResults/CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Report
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: error
