name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            src/Gelyn/packages.lock.json

      - name: Restore dependencies
        run: dotnet restore Gelyn.slnx

      - name: Build
        run: dotnet build Gelyn.slnx --configuration Release --no-restore

      - name: Run unit tests
        id: test
        run: dotnet test Gelyn.slnx --configuration Release --no-build

      - name: Upload test report
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: error
