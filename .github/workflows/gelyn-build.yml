name: Documentation

on:
  workflow_run:
    workflows: [ Build ]
    types: [ completed ]
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            src/Gelyn/packages.lock.json
            .config/dotnet-tools.json

      - name: Restore Dependencies
        run: dotnet restore Gelyn.slnx

      - name: Build
        run: dotnet build Gelyn.slnx --configuration Release --no-restore

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Render the Documentation
        run: >
          dotnet run --project src/Gelyn --configuration Release --no-build
          -- build --config ./docs/gelyn.json --base-url '${{ steps.pages.outputs.base_url }}'

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _docs

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
